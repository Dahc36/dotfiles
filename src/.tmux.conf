# Options
set-window-option -g mode-keys vi

# Remaps
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix y: pick a line of the scrollback with fzf and copy it, trimmed, to the clipboard
bind y display-popup -E -w 100% -h 100% '\
  line=$(tmux capture-pane -p -J -S - | grep -v "^[[:space:]]*$" | fzf --tac --no-sort) \
  && printf "%s" "$line" | sed -E "s/^[[:space:]]+|[[:space:]]+$//g" | pbcopy'
